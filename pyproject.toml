[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conformal-rl"
version = "0.1.0"
description = "Sparse-grid conformal calibration for reinforcement learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "box2d>=2.3.10",
    "gymnasium>=1.1.1",
    "matplotlib>=3.10.3",
    "numpy>=2.1",
    "pygame>=2.6.1",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "stable-baselines3>=2.7.0",
    "torch>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]
analysis = [
    "pandas>=2.3.0",
    "pillow>=11.2.1",
    "rliable>=1.2.0",
    "seaborn>=0.13.2",
]
notebooks = [
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "jupyterlab>=4.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
